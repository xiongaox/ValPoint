name: Deploy dist to VPS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v2.2.5). Leave empty to deploy the release that triggered this workflow."
        required: false
        type: string

concurrency:
  group: deploy-dist-to-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for k in VPS_HOST VPS_USER VPS_SSH_KEY VPS_TARGET_DIR; do
            if [ -z "${!k:-}" ]; then
              echo "Missing required secret: $k"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Required secrets:"
            echo "- VPS_HOST: server host or IP"
            echo "- VPS_USER: ssh user"
            echo "- VPS_SSH_KEY: private key"
            echo "- VPS_TARGET_DIR: deployment base dir on server (e.g. /var/www/valpoint)"
            echo ""
            echo "Optional secrets:"
            echo "- VPS_PORT: ssh port (default 22)"
            echo "- VPS_PROXY: proxy used by the VPS to reach GitHub, e.g. http://127.0.0.1:7890"
            echo "- VPS_POST_DEPLOY: command to run after switching symlink (e.g. sudo systemctl reload nginx)"
            exit 1
          fi

      - name: Resolve SSH port
        id: port
        shell: bash
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VPS_PORT:-22}"
          echo "value=$port" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ steps.port.outputs.value }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Download on VPS, extract & switch current symlink
        shell: bash
        run: |
          ssh -p "${{ steps.port.outputs.value }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            VPS_PROXY='${{ secrets.VPS_PROXY }}' \
            VPS_POST_DEPLOY='${{ secrets.VPS_POST_DEPLOY }}' \
            TAG='${{ steps.tag.outputs.value }}' \
            SHA='${{ github.sha }}' \
            REPO='${{ github.repository }}' \
            BASE='${{ secrets.VPS_TARGET_DIR }}' \
            bash -s <<'REMOTE'
          set -euo pipefail
          release_dir="$BASE/releases/$TAG-$SHA"
          tarball="/tmp/valpoint-dist-$SHA.tar.gz"
          url="https://github.com/$REPO/releases/download/$TAG/dist.tar.gz"
          keep_releases=10

          # 在 VPS 本地直接下载 Release 资产，避免从 GitHub Runner 慢速上行传包。
          # 代理：优先使用 VPS_PROXY secret；未设置时沿用 VPS 自身的 http(s)_proxy 环境变量。
          curl_opts=(-fL --connect-timeout 15 --max-time 1800 --retry 3 --retry-delay 5 --speed-time 60 --speed-limit 1024)
          if [ -n "${VPS_PROXY:-}" ]; then
            curl_opts+=(-x "$VPS_PROXY")
          fi
          echo "Downloading $url"
          curl "${curl_opts[@]}" -o "$tarball" "$url"
          ls -lh "$tarball"

          mkdir -p "$release_dir"
          tar -xzf "$tarball" -C "$release_dir"
          rm -f "$tarball"

          # dist.tar.gz contains 'dist/' at the top-level
          ln -sfn "$release_dir/dist" "$BASE/current"

          # Keep runtime config stable across releases (avoid blank page due to missing/mismatched env-config.js).
          if [ -f "$BASE/env-config.js" ]; then
            cp -f "$BASE/env-config.js" "$BASE/current/env-config.js"
          fi

          # Keep only the latest N releases (by mtime) to avoid disk growth.
          releases_dir="$BASE/releases"
          if [ -d "$releases_dir" ]; then
            mapfile -t releases < <(ls -1dt "$releases_dir"/* 2>/dev/null || true)
            if [ "${#releases[@]}" -gt "$keep_releases" ]; then
              for ((i=keep_releases; i<${#releases[@]}; i++)); do
                rm -rf -- "${releases[$i]}"
              done
            fi
          fi

          if [ -n "${VPS_POST_DEPLOY:-}" ]; then
            eval "$VPS_POST_DEPLOY"
          fi
          REMOTE
